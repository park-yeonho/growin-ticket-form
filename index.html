<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메일 자동 파싱 → 티켓 발행</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f2f7;
    --card: #ffffff;
    --border: #e2e8f0;
    --primary: #667eea;
    --primary2: #764ba2;
    --text: #2d3748;
    --muted: #718096;
    --hint: #a0aec0;
    --success: #48bb78;
    --error: #f56565;
    --warn: #ed8936;
    --parse-bg: #1a1f35;
    --parse-card: #232946;
    --parse-border: #2d3561;
    --parse-accent: #818cf8;
    --parse-text: #e2e8f0;
    --parse-muted: #94a3b8;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 전체 레이아웃 ── */
  .layout {
    display: flex;
    gap: 0;
    align-items: flex-start;
  }

  /* ── 파싱 패널 (고정 왼쪽) ── */
  .parse-panel {
    width: 360px;
    min-width: 360px;
    background: var(--parse-bg);
    min-height: 100vh;
    padding: 20px 16px;
    position: sticky;
    top: 0;
    overflow-y: auto;
    max-height: 100vh;
  }

  .parse-header {
    margin-bottom: 18px;
  }
  .parse-header h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--parse-text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .parse-header p { font-size: 12px; color: var(--parse-muted); margin-top: 4px; }

  .llm-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--parse-card);
    border: 1px solid var(--parse-border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--parse-muted);
    margin-bottom: 14px;
  }
  .llm-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #94a3b8;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .llm-dot.ok  { background: var(--success); box-shadow: 0 0 6px rgba(72,187,120,0.5); }
  .llm-dot.err { background: var(--error); }

  .parse-panel textarea {
    width: 100%;
    min-height: 200px;
    padding: 12px;
    background: var(--parse-card);
    border: 1px solid var(--parse-border);
    border-radius: 10px;
    color: var(--parse-text);
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.15s;
  }
  .parse-panel textarea:focus { border-color: var(--parse-accent); }
  .parse-panel textarea::placeholder { color: #475569; }

  .parse-btn {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-family: inherit;
  }
  .parse-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
  .parse-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 파싱 결과 미리보기 */
  .parse-preview {
    margin-top: 14px;
    display: none;
  }
  .parse-preview.show { display: block; }
  .preview-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--parse-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .preview-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 6px 0;
    border-bottom: 1px solid var(--parse-border);
    font-size: 12px;
  }
  .preview-item:last-child { border-bottom: none; }
  .preview-key { color: var(--parse-muted); flex-shrink: 0; margin-right: 8px; }
  .preview-val { color: var(--parse-text); text-align: right; word-break: break-all; }
  .preview-val.null { color: #475569; font-style: italic; }

  .task-count-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: rgba(129,140,248,0.15);
    border: 1px solid rgba(129,140,248,0.3);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--parse-accent);
    margin-bottom: 10px;
  }

  /* ── 티켓 폼 영역 (오른쪽 스크롤) ── */
  .tickets-area {
    flex: 1;
    padding: 20px 16px;
    overflow-x: auto;
  }

  .tickets-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    min-width: min-content;
  }

  .add-ticket-btn {
    width: 140px;
    align-self: stretch;
    min-height: 300px;
    border: 2px dashed var(--primary);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    font-weight: 300;
    line-height: 1;
    color: var(--primary);
    cursor: pointer;
    flex-shrink: 0;
    background: rgba(102,126,234,0.04);
    transition: background 0.15s, transform 0.1s;
    user-select: none;
  }
  .add-ticket-btn:hover { background: rgba(102,126,234,0.1); transform: translateY(-1px); }

  /* 빈 상태 */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    color: var(--hint);
    text-align: center;
    gap: 12px;
  }
  .empty-state .icon { font-size: 48px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  /* ── 티켓 카드 ── */
  .ticket-card {
    width: 520px;
    min-width: 520px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    overflow: hidden;
    animation: slideIn 0.3s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .ticket-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 12px;
    align-items: center;
    background: linear-gradient(135deg, #667eea08 0%, #764ba208 100%);
  }
  .ticket-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .ticket-header h3 { font-size: 14px; font-weight: 700; color: #1a202c; }
  .ticket-header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ticket-num {
    margin-left: auto;
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: white;
    flex-shrink: 0;
  }

  .ticket-body { padding: 18px 20px 22px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600;
    margin-bottom: 6px; color: #4a5568;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    background: #f7fafc;
    transition: all 0.15s;
    color: var(--text);
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
  }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .field input::placeholder, .field textarea::placeholder { color: #cbd5e0; }

  .row { display: flex; gap: 10px; }
  .row .field { flex: 1; margin-bottom: 14px; }

  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pills-tech { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .pills-tech .pill { text-align: center; white-space: normal; }
  .pill {
    padding: 7px 10px;
    border: 1px solid var(--border);
    background: #f7fafc;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.15s;
    user-select: none;
    color: #4a5568;
    white-space: nowrap;
  }
  .pill:hover { border-color: #cbd5e0; }
  .pill.active {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
    color: white;
    border-color: transparent;
    box-shadow: 0 2px 6px rgba(102,126,234,0.3);
  }

  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    background: #f7fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px; color: #4a5568; font-weight: 500;
    user-select: none;
  }
  .checkbox-row input[type="checkbox"] {
    width: 16px; height: 16px; margin: 0;
    cursor: pointer; accent-color: var(--primary); flex-shrink: 0;
  }

  .submit-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 6px;
    font-family: inherit;
  }
  .submit-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
  }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .submit-btn.done {
    background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
  }

  .secondary-link {
    display: block; text-align: center; margin-top: 10px;
    font-size: 12px; color: var(--muted); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .secondary-link:hover { color: var(--primary); }

  .hint { font-size: 11px; color: var(--hint); margin-top: 4px; }
  .required { color: var(--error); }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 20px; border-radius: 10px; color: white;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 9999;
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s ease;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: #48bb78; }
  .toast.error   { background: #f56565; }
</style>
</head>

function emptyTicketData() {
  return {
    taskName: '', client: '', date: '', startTime: '',

    contractType: '', requester: '', mode: 'all',

// 페이지 로드 시 빈 티켓 1개 기본 표시
renderTickets([emptyTicketData()]);

function resetTickets() {

// ═══════════════════════════════════════════════
//  티켓 카드 복제(+ 버튼)
// ═══════════════════════════════════════════════
function ensureAddTicketBtn() {
  const row = document.getElementById('ticketsRow');
  let btn = document.getElementById('addTicketBtn');
  if (!btn) {
    btn = document.createElement('div');
    btn.id = 'addTicketBtn';
    btn.className = 'add-ticket-btn';
    btn.textContent = '+';
    btn.onclick = duplicateTicket;
  }
  row.appendChild(btn); // 이미 있으면 맨 끝으로 이동
}

function updateTicketNumBadges() {
  const cards = document.querySelectorAll('#ticketsRow .ticket-card');
  cards.forEach((card, i) => {
    let badge = card.querySelector('.ticket-num');
    if (cards.length > 1) {
      if (!badge) {
        badge = document.createElement('div');
        badge.className = 'ticket-num';
        card.querySelector('.ticket-header').appendChild(badge);
      }
      badge.textContent = i + 1;
    } else if (badge) {
      badge.remove();
    }
  });
}

function duplicateTicket() {
  const cards = document.querySelectorAll('#ticketsRow .ticket-card');
  if (!cards.length) return;
  const sourceCard = cards[cards.length - 1];
  const sourceId = sourceCard.querySelector('[id$="_submitBtn"]').id.replace('_submitBtn', '');
  const get = (suffix) => document.getElementById(`${sourceId}_${suffix}`)?.value || '';

  const workDateTime = get('workDateTime');
  const endDateTime  = get('endDateTime');
  const [date, startTime] = workDateTime ? workDateTime.split('T') : ['', ''];
  const endTime = endDateTime ? endDateTime.split('T')[1] : '';
  const nightChecked = document.getElementById(`${sourceId}_nightShift`)?.checked || false;

  const data = {
    taskName: get('title'),
    client: get('customer'),
    date, startTime, endTime,
    type: nightChecked ? '야간' : '',
    location: get('location'),
    replyNeed: getActiveValues(`${sourceId}_reply`),
    techStack: getActiveValues(`${sourceId}_tech`),
    contractType: getActiveValue(`${sourceId}_contract`) === 'percall' ? 'percall' : '',
    requester: get('requester'),
    requesterEmail: get('requesterEmail'),
    mailReceivedTime: get('mailReceivedTime'),
    mode: getActiveValue(`${sourceId}_mode`) === 'clickup' ? 'clickup+메일' : 'all',
    mailSubject: get('mailSubject'),
    assignees: get('assignees'),
    remark: get('remark'),
    replyDeadline: null
  };
  const mailBody = get('mailBody');

  const row = document.getElementById('ticketsRow');
  const newNum = cards.length + 1;
  const newCard = createTicketCard(data, newNum, mailBody, newNum);
  row.appendChild(newCard);

  // 시간값은 원본 그대로 정확히 복제(포맷 왕복 손실 방지)
  const newId = `ticket_${newNum}`;
  const newWorkDT = document.getElementById(`${newId}_workDateTime`);
  const newEndDT  = document.getElementById(`${newId}_endDateTime`);
  if (newWorkDT && workDateTime) newWorkDT.value = workDateTime;
  if (newEndDT && endDateTime) newEndDT.value = endDateTime;

  updateTicketNumBadges();
  ensureAddTicketBtn();

  const bottomInfo = document.getElementById('bottomSubmitInfo');
  if (bottomInfo) bottomInfo.textContent = '캘린더 ' + newNum + '개 + ClickUp ' + newNum + '개 + 메일 1개';

  newCard.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'end' });
}

// ═══════════════════════════════════════════════
//  Toast
// ═══════════════════════════════════════════════
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 3500);
}

// ═══════════════════════════════════════════════
//  티켓 폼 렌더링
// ═══════════════════════════════════════════════
function renderTickets(tasks) {
  const row = document.getElementById('ticketsRow');
  row.innerHTML = '';
  const bottomBar = document.getElementById('bottomSubmitBar');
  const bottomInfo = document.getElementById('bottomSubmitInfo');
  if (bottomBar) {
    bottomBar.style.display = tasks.length >= 1 ? 'block' : 'none';
    if (bottomInfo) bottomInfo.textContent = '캘린더 ' + tasks.length + '개 + ClickUp ' + tasks.length + '개 + 메일 1개';
  }
  document.getElementById('emptyState')?.remove();

  tasks.forEach((data, idx) => {
    row.appendChild(createTicketCard(data, idx + 1, '', tasks.length));
  });
}

function createTicketCard(data, num, mailBodyOriginal, total) {
  const id = `ticket_${num}`;
  const div = document.createElement('div');
  div.className = 'ticket-card';
  div.style.animationDelay = `${(num-1) * 0.08}s`;

  // 날짜/시간 포맷
  const dtVal = formatDT(data.date, data.startTime);
  const isNight = data.type === '야간';
  let endVal = formatDT(data.date, data.endTime, data.startTime);
  if (isNight && dtVal) {
    endVal = formatLocalDT(addHours(dtVal, 24));
  }

  // 등록 모드 매핑
  const modeVal = (data.mode === 'clickup+메일') ? 'clickup' : 'all';

  // techStack 활성화 HTML
  const techStackHTML = [
    ['linux','Linux'],['HA','HA'],['openstack','OpenStack'],
    ['K8S','K8S'],['OpenShift','OpenShift'],['DBMS','DBMS'],
    ['DB Maintenance','DB Maint.'],['DB TroubleShooting','DB TS'],
    ['DB Migration','DB Mig.'],['DB Consulting','DB Con.'],
    ['WEB/WAS','WEB/WAS'],['Jmeter','Jmeter'],
    ['Kubernetes','K8s'],['CI/CD','CI/CD']
  ].map(([v, label]) => {
    const active = (data.techStack || []).includes(v) ? 'active' : '';
    return `<div class="pill ${active}" data-value="${v}" onclick="togglePill(this,'${id}_tech')">${label}</div>`;
  }).join('');

  const replyHTML = [
    ['작업자',' 작업자'],['절차서',' 절차서'],['질문답변',' 질문답변'],['점검 작업',' 점검 작업']
  ].map(([v, label]) => {
    const active = (data.replyNeed || []).includes(v) ? 'active' : '';
    return `<div class="pill ${active}" data-value="${v}" onclick="togglePill(this,'${id}_reply')">${label}</div>`;
  }).join('');

  const customerForTitle = (data.client || '').split('_')[0].trim();
  const titleParts = [customerForTitle, data.location, data.taskName].filter(Boolean);
  const calendarTitle = (data.startTime
    ? '#[미정] '
    : '시간#[미정] '
  ) + titleParts.join(' ');

  div.innerHTML = `
    <div class="ticket-header">
      <div class="ticket-icon"></div>
      <div>
        <h3>작업 새 티켓 발행</h3>
        <p>고객 작업 요청을 티켓으로 발행합니다</p>
      </div>
      ${total > 1 ? `<div class="ticket-num">${num}</div>` : ''}
    </div>
    <div class="ticket-body">

      <div class="field">
        <label> 작업명 <span class="required">*</span></label>
        <input type="text" id="${id}_title" value="${esc(data.taskName || '')}" placeholder="예) VPN 접속 장애" required>
      </div>

      <div class="field">
        <label> 고객사 <span class="required">*</span></label>
        <input type="text" id="${id}_customer" list="${id}_customerList"
          value="${esc(data.client || '')}" placeholder="예) 텔코웨어_SKT" autocomplete="off" required>
        <datalist id="${id}_customerList">
          ${CUSTOMER_LIST.map(c => `<option value="${c}">`).join('')}
        </datalist>
      </div>

      <input type="hidden" id="${id}_mailSubject" value="${esc(data.mailSubject || '')}">

      <div class="field">
        <label> 메일 전체내용</label>
        <textarea id="${id}_mailBody" style="min-height:80px;">${esc(mailBodyOriginal)}</textarea>
        <div class="hint">붙여넣은 내용은 ClickUp Description에 들어갑니다</div>
      </div>

      <div class="row">
        <div class="field">
          <label> 작업 시작 <span class="hint" style="display:inline;margin-left:4px;">(24h)</span></label>
          <input type="datetime-local" id="${id}_workDateTime" value="${dtVal}" onchange="updateEndDateTime('${id}')">
        </div>
        <div class="field">
          <label>⏰ 작업 종료</label>
          <input type="datetime-local" id="${id}_endDateTime" value="${endVal}">
        </div>
      </div>

      <div class="field">
        <label class="checkbox-row" for="${id}_nightShift">
          <input type="checkbox" id="${id}_nightShift" ${isNight ? 'checked' : ''}
            onchange="applyNightShift('${id}')">
          <span> 야간 작업</span>
        </label>
      </div>

      <div class="field">
        <label class="checkbox-row" for="${id}_replyDeadlineEnable" style="margin-bottom:0;">
          <input type="checkbox" id="${id}_replyDeadlineEnable"
            onchange="toggleReplyDeadline('${id}')">
          <span>⏳ 회신기한 설정</span>
        </label>
        <input type="datetime-local" id="${id}_replyDeadline" style="display:none;margin-top:8px;">
      </div>

      <div class="field">
        <label> 장소</label>
        <input type="text" id="${id}_location" value="${esc(data.location || '')}" placeholder="장소">
      </div>

      <div class="field">
        <label> 계약유형 <span class="required">*</span></label>
        <div class="pills" id="${id}_contract">
          <div class="pill ${data.contractType !== 'percall' ? 'active' : ''}"
            data-value="유지보수" onclick="selectPill(this,'${id}_contract')">️ 유지보수</div>
          <div class="pill ${data.contractType === 'percall' ? 'active' : ''}"
            data-value="percall" onclick="selectPill(this,'${id}_contract')"> Per-call</div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label> 요청자</label>
          <input type="text" id="${id}_requester" value="${esc(data.requester || '')}" placeholder="홍길동">
        </div>
        <div class="field">
          <label> 이메일</label>
          <input type="email" id="${id}_requesterEmail" placeholder="hong@growin.co.kr" value="${esc(data.requesterEmail || '')}">
          <input type="hidden" id="${id}_mailReceivedTime" value="${esc(data.mailReceivedTime || '')}">
        </div>
      </div>

      <div class="field">
        <label> 회신필요항목 <span class="required">*</span></label>
        <div class="pills" id="${id}_reply" data-multi="true">${replyHTML}</div>
      </div>

      <div class="field">
        <label> 배정인원</label>
        <input type="text" id="${id}_assignees" value="${esc(data.assignees || '')}" placeholder="예) 홍길동, 김철수">
      </div>

      <div class="field">
        <label>里 요소기술</label>
        <div class="pills pills-tech" id="${id}_tech" data-multi="true">${techStackHTML}</div>
      </div>

      <div class="field">
        <label>️ 비고</label>
        <textarea id="${id}_remark" placeholder="기타 참고사항">${esc(data.remark || '')}</textarea>
      </div>

      <div class="field">
        <label> 등록 모드</label>
        <div class="pills" id="${id}_mode">
          <div class="pill ${modeVal === 'all' ? 'active' : ''}"
            data-value="all" onclick="selectPill(this,'${id}_mode')"> 전체</div>
          <div class="pill ${modeVal === 'clickup' ? 'active' : ''}"
            data-value="clickup" onclick="selectPill(this,'${id}_mode')"> ClickUp+메일</div>
        </div>
      </div>

      <button class="submit-btn" id="${id}_submitBtn" onclick="submitTicket('${id}')">
         티켓 메일 발송
      </button>
      
    </div>
  `;

  return div;
}

// ═══════════════════════════════════════════════
//  Pill 헬퍼
// ═══════════════════════════════════════════════
function selectPill(pill, groupId) {
  document.querySelectorAll(`#${groupId} .pill`).forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
}
function togglePill(pill, groupId) {
  pill.classList.toggle('active');
  // 회신필요항목에서 질문답변/절차서 선택 시 모드 자동 변경
  if (groupId && groupId.endsWith('_reply')) {
    const ticketId = groupId.replace('_reply', '');
    const activeVals = getActiveValues(groupId);
    const autoMail = activeVals.includes('질문답변') || activeVals.includes('절차서');
    if (autoMail) {
      // clickup+메일 모드로 자동 변경
      document.querySelectorAll(`#${ticketId}_modeGroup .pill`).forEach(p => {
        p.classList.remove('active');
        if (p.dataset.value === 'clickup+메일') p.classList.add('active');
      });
      // 절차서/질문답변 선택 시 장소 비어있으면 원격으로 자동 설정
      // 단, 작업자+절차서 조합(질문답변 미포함)일 때는 기존 로직 유지(자동설정 안 함)
      const skipLocationAuto = activeVals.includes('작업자') && activeVals.includes('절차서') && !activeVals.includes('질문답변');
      if (!skipLocationAuto) {
        const loc = document.getElementById(`${ticketId}_location`);
        if (loc && !loc.value.trim()) {
          loc.value = '원격';
        }
      }
    } else {
      // 절차서/질문답변이 모두 해제되면 자동 설정됐던 원격 값 제거
      const loc = document.getElementById(`${ticketId}_location`);
      if (loc && loc.value.trim() === '원격') {
        loc.value = '';
      }
    }
  }
}
function getActiveValue(groupId) {
  return document.querySelector(`#${groupId} .pill.active`)?.dataset.value || '';
}
function getActiveValues(groupId) {
  return Array.from(document.querySelectorAll(`#${groupId} .pill.active`)).map(p => p.dataset.value);
}

// ═══════════════════════════════════════════════
//  날짜 헬퍼
// ═══════════════════════════════════════════════
function pad(n) { return String(n).padStart(2, '0'); }
function formatLocalDT(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function addHours(dt, hours) {
  return new Date(new Date(dt).getTime() + hours * 3600000);
}
function formatDT(date, time, fallbackStartTime) {
  if (!date) {
    const t = new Date();
    t.setDate(t.getDate() + 1);
    t.setHours(fallbackStartTime ? parseInt(fallbackStartTime) : 10, 0, 0, 0);
    return formatLocalDT(t);
  }
  if (!time || time === 'null') {
    const defaultH = fallbackStartTime ? fallbackStartTime.substring(0,2) : '10';
    return `${date}T${defaultH}:00`;
  }
  try { return `${date}T${time}`; } catch { return ''; }
}

function toggleReplyDeadline(id) {
  const cb = document.getElementById(`${id}_replyDeadlineEnable`);
  const inp = document.getElementById(`${id}_replyDeadline`);
  inp.style.display = cb.checked ? 'block' : 'none';
  if (cb.checked && !inp.value) {
    const t = new Date(); t.setHours(18, 0, 0, 0);
    inp.value = formatLocalDT(t);
  }
}
function applyNightShift(id) {
  updateEndDateTime(id);
}
function updateEndDateTime(id) {
  const cb = document.getElementById(`${id}_nightShift`);
  const start = document.getElementById(`${id}_workDateTime`);
  const end   = document.getElementById(`${id}_endDateTime`);
  if (!start.value) return;
  const hours = (cb && cb.checked) ? 24 : 1;
  end.value = formatLocalDT(addHours(start.value, hours));
}

function esc(s) { return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════════════════════════════════════
//  티켓 발행
// ═══════════════════════════════════════════════
function buildTicketData(id, asDraft = false) {
  const get = (suffix) => document.getElementById(`${id}_${suffix}`)?.value?.trim() || '';

  const title       = get('title');
  const customer    = get('customer');
  const replyNeed   = getActiveValues(`${id}_reply`);
  const contractType = getActiveValue(`${id}_contract`);
  const startDt = get('workDateTime');
  const endDt   = get('endDateTime');
  const replyDt = document.getElementById(`${id}_replyDeadlineEnable`)?.checked ? get('replyDeadline') : '';
  const nightFlag = document.getElementById(`${id}_nightShift`)?.checked;
  const techStack = getActiveValues(`${id}_tech`);
  const maxLevel  = techStack.reduce((m, v) => Math.max(m, TECH_LEVEL_MAP[v] || 0), 0);
  const location  = get('location');
  const customerForTitle = customer.split('_')[0].trim();
  const titleParts = [customerForTitle, location, title].filter(Boolean);

  return {
    submitMode: getActiveValue(`${id}_mode`) || 'all',
    title, customer,
    mailSubject: get('mailSubject'),
    mailBody:    get('mailBody'),
    contractType,
    requester:      get('requester'),
    requesterEmail: get('requesterEmail'),
    mailReceivedTime: get('mailReceivedTime'),
    mailReceivedTime: get('mailReceivedTime'),
    techLevel:  maxLevel > 0 ? `L${maxLevel}` : '',
    workDateTime: startDt ? startDt.replace('T',' ') : '',
    endDateTime:  endDt   ? endDt.replace('T',' ')   : '',
    replyDeadline: replyDt ? replyDt.replace('T',' ') : '',
    nightShift: nightFlag ? 'Y' : 'N',
    dayNight:   nightFlag ? '야간' : '주간',
    location,
    replyNeed,
    procedureSubtask: replyNeed.includes('절차서') ? 'Y' : 'N',
    assignees: get('assignees'),
    techStack,
    remark: get('remark'),
    calendarTitle: (get('workDateTime') ? '#[미정] ' : '시간#[미정] ') + titleParts.join(' '),
    calendarLocation: location,
    calendarDescription: [get('mailSubject'), get('mailBody')].filter(Boolean).join('\n\n'),
    asDraft: !!asDraft
  };
}

function getAllTicketIds() {
  return [...document.querySelectorAll('#ticketsRow .ticket-card')].map(card => {
    const btn = card.querySelector('[id$="_submitBtn"]');
    return btn?.id?.replace('_submitBtn', '') || null;
  }).filter(Boolean);
}

function submitTicket(id, asDraft = false) {
  const get = (suffix) => document.getElementById(`${id}_${suffix}`)?.value?.trim() || '';

  const title       = get('title');
  const customer    = get('customer');
  const replyNeed   = getActiveValues(`${id}_reply`);
  const contractType = getActiveValue(`${id}_contract`);

  if (!title)    { showToast('작업명을 입력하세요', 'error'); return; }
  if (!customer) { showToast('고객사를 입력하세요', 'error'); return; }
  if (!contractType) { showToast('계약유형을 선택하세요', 'error'); return; }
  if (!replyNeed.length) { showToast('회신필요항목을 선택하세요', 'error'); return; }

  const data = buildTicketData(id, asDraft);

  const btn = document.getElementById(`${id}_submitBtn`);
  btn.disabled = true;
  btn.textContent = asDraft ? '저장 중...' : '발송 중...';

  const finishOK = () => {
    showToast(asDraft ? '✏️ 초안 저장 완료' : '✅ 티켓 발행 완료!');
    btn.disabled = false;
    btn.textContent = '✅ 완료';
    btn.classList.add('done');
  };
  const finishErr = (msg) => {
    showToast('❌ ' + msg, 'error');
    btn.disabled = false;
    btn.textContent = ' 티켓 메일 발송';
  };

  if (typeof google !== 'undefined' && google.script?.run) {
    google.script.run
      .withSuccessHandler(finishOK)
      .withFailureHandler(e => finishErr(e.message || '발송 실패'))
      .sendTicketEmail(data);
    return;
  }

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ ...data, key: ACCESS_KEY })
  })
  .then(r => r.json())
  .then(res => res.ok ? finishOK() : finishErr(res.error || '발송 실패'))
  .catch(e => finishErr(e.message));
}

function submitAllTickets() {
  const ids = getAllTicketIds();
  if (!ids.length) return;

  for (const id of ids) {
    const get = (suffix) => document.getElementById(`${id}_${suffix}`)?.value?.trim() || '';
    if (!get('title'))    { showToast('작업명을 입력하세요', 'error'); return; }
    if (!get('customer')) { showToast('고객사를 입력하세요', 'error'); return; }
    if (!getActiveValue(`${id}_contract`)) { showToast('계약유형을 선택하세요', 'error'); return; }
    if (!getActiveValues(`${id}_reply`).length) { showToast('회신필요항목을 선택하세요', 'error'); return; }
  }

  const allData = ids.map(id => buildTicketData(id, false));

  const btn = document.getElementById('submitAllBtn');
  btn.disabled = true;
  btn.textContent = ' 발송 중...';

  const cardBtns = ids.map(id => document.getElementById(`${id}_submitBtn`));

  const finishOK = () => {
    showToast(`✅ 전체 ${ids.length}건 발행 완료!`);
    btn.disabled = false;
    btn.textContent = '✅ 전체 티켓 발행 완료';
    cardBtns.forEach(b => {
      if (!b) return;
      b.disabled = true;
      b.textContent = '✅ 완료';
      b.classList.add('done');
    });
  };
  const finishErr = (msg) => {
    showToast('❌ ' + msg, 'error');
    btn.disabled = false;
    btn.textContent = ' 전체 티켓 발행';
  };

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ multiTicket: true, tasks: allData, key: ACCESS_KEY })
  })
  .then(r => r.json())
  .then(res => res.ok ? finishOK() : finishErr(res.error || '발송 실패'))
  .catch(e => finishErr(e.message));
}
</script>
